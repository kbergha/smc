; Production-optimized OPcache settings (baked into image).
; Local dev overrides are in x-local-development-overrides-php.ini (mounted via docker-compose).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.fast_shutdown=1
opcache.blacklist_filename=/usr/local/etc/php/opcache-blacklist.txt

; JIT (PHP 8.1+) — tracing mode for best performance
opcache.jit=1255
opcache.jit_buffer_size=64M
