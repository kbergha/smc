date.timezone = Europe/Oslo
short_open_tag = false
# Rule of thumb says memory_limit should be twice the size of post_max_size/upload_max_filesize
memory_limit = 128M
# Temporary increased memory limit
max_input_vars = 10000

# max_execution_time: changes here must be implemented here in load balancer deregistration delay
max_execution_time = 120

log_errors = true
display_errors = true
display_startup_errors = true
error_reporting = E_ALL
error_log = /proc/self/fd/2
upload_max_filesize = 64M
post_max_size = 64M
session.cookie_secure = true
session.gc_maxlifetime = 3600

; Realpath cache — avoids repeated stat()/realpath() calls for include/require paths.
; Default is 4K which is too small for projects with deep vendor paths.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
