<VirtualHost *:8080>
  ServerAdmin smc@smc.smc
  DocumentRoot ${APACHE_DOCUMENT_ROOT}

  # SECURITY HEADERS

  # HSTS
  Header always set Strict-Transport-Security "max-age=63072000; includeSubdomains;"

  # CSP
  # See https://content-security-policy.com
  # See https://csp-evaluator.withgoogle.com
  # script-src with 'unsafe-eval' is due to the way we use Vue 3.
  # Can probably be solved with precompiling Vue 3 Components + Vite, but that is hard / poorly documented.
  # https://stackoverflow.com/questions/78111581/how-to-precompile-vue-3-components-using-vite-and-use-them-as-js-module-in-stati
  # https://ods.cdn.web.oslo.kommune.no
  Header set Content-Security-Policy " \
    default-src 'none'; \
    worker-src 'self' \
    script-src 'self' \
    style-src 'self' \
    style-src-elem 'self' \
    img-src 'self' \
    connect-src 'self' \
    font-src 'self' \
    object-src 'none'; \
    base-uri 'self'; \
    form-action 'self' \
    frame-src 'self' \
    frame-ancestors 'self' \
  "
  # X-FRAME
  Header always set X-Frame-Options "SAMEORIGIN"
  # X-Content-Type
  Header set X-Content-Type-Options nosniff
  # Referrer
  Header always set Referrer-Policy "same-origin"
  # X-XSS
  Header set X-XSS-Protection "1; mode=block"

  # Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
  # error, crit, alert, emerg.
  # It is also possible to configure the loglevel for particular
  # modules, e.g.
  #LogLevel info ssl:warn

  #SetEnvIf User-Agent "ELB-HealthChecker/2.0" dontlog

  ErrorLogFormat "{ \"Source\":\"Apache\", \"DateTime\":\"%{%Y-%m-%dT%H:%M:%SZ}t\", \"Function\" : \"[%-m:%l]\" , \"Process\" : \"[pid %P:tid %T]\" , \"Message\" : \"%M\" ,\ \"Referer\"\ : \"%{Referer}i\", \"X-Forwarded-For\":\"%{X-Forwarded-For}i\", \"X-Amzn-Trace-Id\":\"%{X-Amzn-Trace-Id}i\" }"
  # todo:
  # Fjernet X-Amzn-Trace-Id;
  # Syntax error ErrorLogFormat type must be one of request, connection
  ErrorLog ${APACHE_LOG_DIR}/error.log

  LogFormat "{ \"Source\":\"Apache\", \"DateTime\":\"%{%Y-%m-%dT%H:%M:%SZ}t\", \"RemoteIP\":\"%a\", \"Host\":\"%V\", \"Port\":\"%p\", \"Request\":\"%U\", \"Query\":\"%q\", \"File\":\"%f\", \"Method\":\"%m\", \"Status\":\"%>s\", \"UserAgent\":\"%{User-agent}i\", \"Referer\":\"%{Referer}i\", \"X-Forwarded-For\":\"%{X-Forwarded-For}i\", \"X-Amzn-Trace-Id\":\"%{X-Amzn-Trace-Id}i\" }" jsonlog
  CustomLog ${APACHE_LOG_DIR}/access.log jsonlog env=!dontlog

  # For most configuration files from conf-available/, which are
  # enabled or disabled at a global level, it is possible to
  # include a line for only one particular virtual host. For example the
  # following line enables the CGI configuration for this host only
  # after it has been globally disabled with "a2disconf".
  #Include conf-available/serve-cgi-bin.conf

  <Directory ${APACHE_DOCUMENT_ROOT}>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectorySlash Off

    <IfModule mod_rewrite.c>
      # Mostly the same as the default .htaccess file from Craft.

      # Log level for rewrite rules - enable for debugging rewrite rules
      # LogLevel alert rewrite:trace3
      # Enable rewrite engine
      RewriteEngine On

      RewriteBase /

      # Send would-be 404 requests to SMC
      RewriteCond %{REQUEST_FILENAME} !-f
      RewriteCond %{REQUEST_FILENAME} !-d
      RewriteCond %{REQUEST_URI} !^/(favicon\.ico|apple-touch-icon.*\.png)$ [NC]
      RewriteRule ^(.+) index.php?p=$1 [QSA,L]
      # The ^ anchor ensures the match starts at the very beginning of the URL path.
    </IfModule>
  </Directory>
</VirtualHost>
