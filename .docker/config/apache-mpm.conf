# Apache MPM Prefork configuration for optimal performance with Frontend
# StartServers: Number of child server processes created on startup
# MinSpareServers: Minimum number of idle child server processes
# MaxSpareServers: Maximum number of idle child server processes
# MaxRequestWorkers: Maximum number of simultaneous connections
# ServerLimit: Upper limit on the number of server processes
# MaxConnectionsPerChild: Number of requests a child process will handle before terminating

<IfModule mpm_prefork_module>
  StartServers          4
  MinSpareServers       4
  MaxSpareServers       8
  MaxRequestWorkers     16
  ServerLimit           16
  MaxConnectionsPerChild 2000
</IfModule>
