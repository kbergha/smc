; This file is mounted via compose.yml and overrides php.ini / opcache.ini
; settings for local development. It is loaded last (alphabetically: x > o).
;
; If you add more settings here, please document with a line or two with the reasons why.

; --- Session ---
session.cookie_secure = Off

; --- OPcache overrides for local dev ---
; The image has validate_timestamps=0 for production (files never change in a container).
; Locally we mount source code as volumes, so PHP must check for file changes.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; JIT must be disabled when Xdebug is active (they conflict).
; Xdebug is enabled locally via the xdebug.ini mount in compose.yml.
opcache.jit = disable
opcache.jit_buffer_size = 0
